<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog Article</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #progress { height: 4px; background: blue; width: 0; position: fixed; top: 0; left: 0; }
  </style>
</head>
<body>

<div id="progress"></div>

<header class="bg-light p-3">
  <h2 class="container">Blog Title</h2>
</header>

<div class="container mt-4">
  <div class="row">
    <article class="col-md-8" id="article">
      <p>Lorem ipsum dolor sit amet...</p>
      <p style="height:1200px">Long article content...</p>
    </article>

    <aside class="col-md-4">
      <h5>Related Posts</h5>
      <ul>
        <li><a href="#">Post One</a></li>
        <li><a href="#">Post Two</a></li>
      </ul>
    </aside>
  </div>
</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
  Footer
</footer>

<script>
window.addEventListener("scroll", () => {
  const total = document.body.scrollHeight - window.innerHeight;
  const progress = (window.scrollY / total) * 100;
  document.getElementById("progress").style.width = progress + "%";
});
</script>

</body>
</html>
