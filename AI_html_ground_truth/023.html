<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social Feed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header class="bg-primary text-white p-3 text-center">
  <h4>Social Feed</h4>
</header>

<main class="container mt-4" id="feed"></main>

<script>
let postCount = 0;

function createPost() {
  postCount++;
  return `
    <div class="card mb-3">
      <div class="card-body">
        <h6>User ${postCount}</h6>
        <p>Post content #${postCount}</p>
        <button class="btn btn-outline-primary btn-sm" onclick="like(this)">👍 <span>0</span></button>
        <div class="ms-3 mt-2">
          <strong>Commenter</strong>
          <p>Nice!</p>
        </div>
      </div>
    </div>
  `;
}

function like(btn) {
  const span = btn.querySelector("span");
  span.textContent = +span.textContent + 1;
}

function loadPosts(count = 3) {
  for (let i = 0; i < count; i++) {
    feed.insertAdjacentHTML("beforeend", createPost());
  }
}

window.addEventListener("scroll", () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 50) {
    loadPosts(2);
  }
});

loadPosts(5);
</script>

</body>
</html>
