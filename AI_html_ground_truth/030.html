<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LMS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid mt-3">
  <div class="row">
    <aside class="col-md-3">
      <h5>Lessons</h5>
      <ul class="list-group" id="lessonList"></ul>
    </aside>

    <main class="col-md-9">
      <div class="border p-5 text-center mb-3" id="videoPlayer">
        <h4>Video Player</h4>
        <p id="currentLesson">Select a lesson</p>
      </div>
      <div>Progress: <span id="progress">0%</span></div>
    </main>
  </div>
</div>

<script src="lms.js"></script>
</body>
</html>
