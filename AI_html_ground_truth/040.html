<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
  <h3>Settings</h3>

  <div class="form-check form-switch mb-3">
    <input class="form-check-input" type="checkbox" id="darkMode">
    <label class="form-check-label">Dark Mode</label>
  </div>

  <h5>Notifications</h5>
  <div>
    <input type="radio" name="notify" value="all" checked> All  
    <input type="radio" name="notify" value="email"> Email Only  
  </div>

  <button class="btn btn-danger mt-3" onclick="deleteAccount()">Delete Account</button>
</div>

<script src="settings.js"></script>
</body>
</html>
