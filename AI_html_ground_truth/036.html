<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
  <h3>Travel Booking</h3>

  <ul class="nav nav-tabs">
    <li class="nav-item"><button class="nav-link active" onclick="setMode('flights')">Flights</button></li>
    <li class="nav-item"><button class="nav-link" onclick="setMode('hotels')">Hotels</button></li>
    <li class="nav-item"><button class="nav-link" onclick="setMode('cars')">Cars</button></li>
  </ul>

  <div class="mt-3">
    <input id="from" class="form-control mb-2" placeholder="From">
    <input id="to" class="form-control mb-2" placeholder="To">
    <input type="date" id="date" class="form-control mb-2">
    <button class="btn btn-primary" onclick="search()">Search</button>
  </div>

  <div id="results" class="mt-3"></div>
</div>

<script src="travel.js"></script>
</body>
</html>
