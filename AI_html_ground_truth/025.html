<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Real Estate Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid mt-3">
  <div class="row">
    <!-- Property List -->
    <aside class="col-md-4">
      <h5>Properties</h5>
      <select id="priceFilter" class="form-select mb-3">
        <option value="all">All Prices</option>
        <option value="300">Up to £300k</option>
        <option value="500">Up to £500k</option>
      </select>
      <div id="propertyList"></div>
    </aside>

    <!-- Map -->
    <main class="col-md-8">
      <div class="border rounded p-5 text-center" id="map">
        <h4>Map Placeholder</h4>
        <p id="mapInfo">Select a property</p>
      </div>
    </main>
  </div>
</div>

<script src="real-estate.js"></script>
</body>
</html>
